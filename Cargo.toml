[workspace]
members = ["crates/*"]
default-members = ["crates/dlin"]
resolver = "3"

[workspace.package]
version = "0.2.4-rc.3"
edition = "2024"
license = "MIT"
repository = "https://github.com/eitsupi/dlin"
homepage = "https://github.com/eitsupi/dlin"

[workspace.dependencies]
petgraph = { version = "0.8", features = ["serde-1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "1.0.1"
regex = "1"
walkdir = "2"
colored = "3"
anyhow = "1"
thiserror = "2"
indexmap = "2"
minijinja = "2"
rayon = "1"
globset = "0.4"
sqllineage = { git = "https://github.com/funcpp/sqllineage.git", rev = "e1daacec792b77dd4ff80101b7f8ed207038c650", default-features = false }
# Must stay in lockstep with the sqlparser version sqllineage depends on; see
# `sqlparser_version_matches_sqllineage` in dlin-core.
sqlparser = { version = "0.62", features = ["serde", "visitor"] }
path-slash = "0.2.1"
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"

# dev
tempfile = "3"
filetime = "0.2"
insta = "1"
serial_test = "4.0.1"

# internal
dlin-core = { version = "0.2.4-rc.3", path = "crates/dlin-core" }

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin_include)'] }

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
opt-level = "s"
panic = "abort"
