[workspace]
members = ["crates/*"]
default-members = ["crates/dlin"]
resolver = "3"

[workspace.package]
version = "0.2.4-rc.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/eitsupi/dlin"
homepage = "https://github.com/eitsupi/dlin"

[workspace.dependencies]
petgraph = { version = "0.8", features = ["serde-1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "0.0.29"
regex = "1"
walkdir = "2"
colored = "3"
anyhow = "1"
thiserror = "2"
indexmap = "2"
minijinja = "2"
rayon = "1"
globset = "0.4"
polyglot-sql = { version = "0.8.0", default-features = false, features = ["all-dialects", "semantic"] }
path-slash = "0.2.1"
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"

# dev
tempfile = "3"
insta = "1"
serial_test = "4.0.1"

# internal
dlin-core = { version = "0.2.4-rc.2", path = "crates/dlin-core" }

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin_include)'] }

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
opt-level = "s"
panic = "abort"
