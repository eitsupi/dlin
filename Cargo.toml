[package]
name = "dlin"
version = "0.1.0-rc.1"
edition = "2024"
description = "A fast CLI tool for dbt model lineage analysis"
license = "MIT"
repository = "https://github.com/eitsupi/dlin"
homepage = "https://github.com/eitsupi/dlin"
readme = "README.md"
keywords = ["dbt", "lineage", "dag", "sql", "cli"]
categories = ["command-line-utilities", "visualization"]

[[bin]]
name = "dlin"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
petgraph = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "0.0.21"
regex = "1"
walkdir = "2"
colored = "2"
anyhow = "1"
thiserror = "2"
indexmap = "2"
minijinja = "2"
rayon = "1"
globset = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin_include)'] }

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
opt-level = "s"
panic = "abort"

[dev-dependencies]
tempfile = "3"
regex = "1"
insta = "1"
